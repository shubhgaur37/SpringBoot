spring:

  datasource:
    url: jdbc:mysql://${DB_URL}:3306/${DB_NAME} # in environment variables
    username: ${DB_USERNAME}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    # Flyway expects to manage the database schema from the beginning. If the
    # database already contains tables but has no flyway_schema_history table,
    # startup fails because no baseline migration has been established.
    #
    # Possible solutions:
    #   1. Disable Flyway temporarily (enabled: false).
    #   2. Enable baseline-on-migrate to register the existing schema as the
    #      starting point for future migrations.
    enabled: false

deployment:
  env: DEV