spring:
  application:
    name: M7_TestingMethodologies

  datasource:
    url: jdbc:mysql://${DB_URL}:3306/${DB_NAME} # in environment variables
    username: ${DB_USERNAME}
    password: ${DB_PASS}

  jpa:
    hibernate:
      # Validates that the existing database schema matches the JPA entities.
      # Does not create or modify tables.
      #
      # Commonly used with Flyway in production. Flyway first applies any pending
      # migrations, after which Hibernate verifies that the final schema matches
      # the entity definitions. Application startup fails if validation fails.
      ddl-auto: validate

      # Hibernate neither creates nor validates the database schema.
      #
      # Commonly used in production when Flyway is the sole owner of schema
      # creation and evolution. All schema changes are managed through versioned
      # SQL migration scripts.
      # ddl-auto: none

#  flyway is enabled by default here
#  flyway:
#    enabled: false # for prod application to start
#    baseline-on-migrate: true # migrate schema # not required baselining completed
#    baseline-version: 1 # 1 by default
deployment:
  env: PROD