version: 0.2

phases:
  install:
    runtime-versions:
      # Provision the build environment with Amazon Corretto JDK 21 before
      # executing any build commands.
      java: corretto21

  build:
    commands:
      - echo "Changing directory to M7_TestingMethodologies"

      # CodeBuild clones the entire repository into a temporary working
      # directory. Since this repository contains multiple projects, navigate
      # to the Maven project that should be built.
      - cd M7_TestingMethodologies

      # Executes the Maven Build Lifecycle.
      #
      # clean
      #   Removes the previous target/ directory to ensure a fresh build.
      #
      # package
      #   Executes the lifecycle up to the package phase:
      #
      #       Validate
      #           ↓
      #       Compile
      #           ↓
      #       Test (skipped below)
      #           ↓
      #       Package
      #
      # During the package phase Maven creates an executable Spring Boot JAR
      # inside:
      #
      #   target/
      #     M7_TestingMethodologies-0.0.1-SNAPSHOT.jar
      #
      # Maven's responsibility ends once this JAR has been created.
      #
      # -DskipTests skips executing the tests while still compiling the test
      # source code.
      - mvn clean package

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:

  # Maven only creates the JAR; it does NOT upload it anywhere.
  #
  # CodeBuild now needs to know which files should be packaged and passed to
  # the next stage of CodePipeline.
  #
  # By default CodeBuild searches from the repository root
  # (CODEBUILD_SRC_DIR). Since the generated JAR resides inside the project's
  # target/ directory, base-directory changes the starting location for
  # artifact discovery.
  #
  # Instead of searching:
  #
  # Repository
  # ├── README.md
  # ├── docs/
  # └── SpringBOOT/
  #     └── M7_TestingMethodologies/
  #         └── target/
  #
  # CodeBuild begins searching directly from:
  #
  # SpringBOOT/M7_TestingMethodologies/target
  #
  # allowing simple patterns such as "*.jar".
  base-directory: M7_TestingMethodologies/target

  # By default, CodeBuild searches for artifacts relative to the Git repository
  # root (CODEBUILD_SRC_DIR).
  #
  # NOTE:
  # The Git repository itself is NOT checked out as a parent directory. Instead,
  # CodeBuild checks out only the repository contents into its working directory.
  #
  # Example:
  #
  # Local machine
  # ~/Documents/
  # └── SpringBoot/                  ← Git repository folder
  #     ├── M7_TestingMethodologies/
  #     ├── CurrencyConverter/
  #     └── Module3/
  #
  # CodeBuild Workspace
  # /codebuild/output/src.../src/
  # ├── M7_TestingMethodologies/
  # ├── CurrencyConverter/
  # └── Module3/
  #
  # Since the repository folder ("SpringBoot") itself is not recreated,
  # all paths in buildspec.yml should be specified relative to the repository
  # contents.
  #
  # Correct:
  #   M7_TestingMethodologies/
  #
  # Incorrect:
  #   SpringBoot/M7_TestingMethodologies/
  #
  # Maven generates the application JAR inside:
  #
  #   M7_TestingMethodologies/target/
  #
  # Therefore, begin artifact discovery from that directory.

  # ------------------------------------------------------------

  # Include every JAR file generated by the Maven package phase.
  files:
    - "*.jar"

  # Controls only how the FINAL BUILD ARTIFACT is packaged.
  #
  # It DOES NOT:
  #   • affect the Maven build
  #   • affect artifact discovery
  #   • modify the JAR itself
  #
  # It ONLY determines whether the original directory hierarchy is preserved
  # inside the build artifact uploaded by CodeBuild.
  #
  # discard-paths: no
  #
  # Build Artifact (ZIP)
  # └── SpringBOOT/
  #     └── M7_TestingMethodologies/
  #         └── target/
  #             └── M7_TestingMethodologies-0.0.1-SNAPSHOT.jar
  #
  # discard-paths: yes
  #
  # Build Artifact (ZIP)
  # └── M7_TestingMethodologies-0.0.1-SNAPSHOT.jar
  #
  # Flattening the directory structure produces a cleaner deployment artifact
  # because downstream deployment stages typically require only the generated
  # application JAR rather than the original repository layout.
  discard-paths: yes

cache:
  paths:

    # Cache Maven's local repository.
    #
    # Maven downloads project dependencies (Spring Boot, Hibernate, Flyway,
    # Lombok, JUnit, etc.) from Maven Central and stores them under:
    #
    #   ~/.m2/repository
    #
    # In AWS CodeBuild the home directory is:
    #
    #   /root/.m2/repository
    #
    # CodeBuild environments are ephemeral (temporary). Without caching,
    # every build downloads all dependencies again.
    #
    # Build #1
    # ----------
    # Restore cache (none)
    #          ↓
    # Download dependencies
    #          ↓
    # Build application
    #          ↓
    # Save ~/.m2 cache
    #
    # Build #2
    # ----------
    # Restore ~/.m2 cache
    #          ↓
    # Reuse previously downloaded dependencies
    #          ↓
    # Download only newly introduced dependencies
    #          ↓
    # Build application
    #
    # ** recursively matches every file and directory beneath ~/.m2.
    - "/root/.m2/**/*"